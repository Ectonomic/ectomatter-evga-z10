# The EVGA Z10 RGB's core, as the WebAssembly module Ectomatter runs (core.json
# names it). Built for wasm32-wasip2 by tools/build-cores.sh, which puts it
# beside core.json as core.wasm. Its own workspace, since it builds only for
# WebAssembly.
[package]
name = "evga-z10-core"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
evga-z10 = { path = "../../../crates/evga-z10", default-features = false }
# the protocol's words for what a press sent
ectomatter-protocol = { path = "../../../crates/ectomatter-protocol" }
serde_json = "1"
wit-bindgen = "=0.63.0"

[workspace]

[profile.release]
lto = true
strip = true
